load_module modules/ngx_http_vhost_traffic_status_module.so;

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    vhost_traffic_status_zone shared:vts:2m;

    proxy_cache_path /var/cache/nginx/cache levels=1:2 keys_zone=demo_cache:1m max_size=8m inactive=10m use_temp_path=off;

    upstream backend_api {
        server 127.0.0.1:9001;
        server 127.0.0.1:9002;
    }

    upstream backend_web {
        server 127.0.0.1:9001;
    }

    # Lightweight in-process "origin" so upstreamZones receive responses.
    server {
        listen 127.0.0.1:9001;
        location / { return 200 "origin-9001\n"; }
    }
    server {
        listen 127.0.0.1:9002;
        location / { return 200 "origin-9002\n"; }
    }

    # Public server zone: api.example.test
    server {
        listen 80;
        server_name api.example.test;

        location / {
            proxy_pass http://backend_api;
        }
        location /slow {
            return 200 "ok\n";
        }
    }

    # Public server zone: web.example.test (with proxy_cache)
    server {
        listen 80;
        server_name web.example.test;

        location / {
            proxy_cache demo_cache;
            proxy_cache_valid 200 1m;
            proxy_pass http://backend_web;
        }
        location /static {
            return 200 "static\n";
        }
    }

    # Default fall-through for `curl http://localhost/` lookups.
    server {
        listen 80 default_server;
        server_name _;

        location / {
            return 200 "default\n";
        }
    }

    # VTS status endpoint
    server {
        listen 8081;
        server_name vts;

        location /status {
            vhost_traffic_status_bypass_limit on;
            vhost_traffic_status_bypass_stats on;
            vhost_traffic_status_display;
            vhost_traffic_status_display_format json;
        }
    }
}
