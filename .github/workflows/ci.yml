name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo build
        run: cargo build --all-targets --all-features --locked
      - name: cargo test
        run: cargo test --all-features --locked

  msrv:
    name: msrv (1.74)
    runs-on: ubuntu-latest
    # TODO(#79): 推移依存 idna_adapter v1.2.2 が edition="2024" を使うため
    # 現状 Rust 1.74 では cargo build が必ず fail する。
    # 短期 mitigation として continue-on-error: true で auto-merge を解除しつつ
    # MSRV 失敗シグナルは Actions の job 一覧で可視化する。
    # 長期対応: MSRV を 1.85+ に引き上げ、または idna_adapter を pin downgrade。
    continue-on-error: true
    env:
      # Cargo.toml の rust-version と一致させる。引き上げは別 PR + issue #7 で議論。
      RUSTUP_TOOLCHAIN: "1.74"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.74"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify rust-version field matches MSRV job
        run: |
          declared=$(grep -E '^rust-version' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$declared" != "1.74" ]; then
            echo "::error::Cargo.toml rust-version ($declared) does not match MSRV job (1.74)"
            echo "MSRV bumps must be discussed in issue #7 and applied in a dedicated PR."
            exit 1
          fi
      - name: cargo build --locked (MSRV)
        run: cargo build --all-targets --all-features --locked
      - name: cargo test --locked (MSRV)
        run: cargo test --all-features --locked
