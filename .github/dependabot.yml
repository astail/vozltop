version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Tokyo"
    labels:
      - "area:deps"
      - "type:chore"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    open-pull-requests-limit: 10
    groups:
      patch-and-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    # major bump は groups に含めず単独 PR で出す（CHANGELOG 確認とテスト更新を伴うため、
    # patch/minor のまとめ PR とは別レビュー単位にしたい）

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Tokyo"
    labels:
      - "area:ci"
      - "type:chore"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
