[package]
name = "vozltop"
version = "0.1.0"
edition = "2021"
description = "htop-like real-time TUI for nginx-module-vts"
repository = "https://github.com/astail/vozltop"
license = "MIT"
readme = "README.md"
keywords = ["nginx", "vts", "tui", "monitoring"]
categories = ["command-line-utilities"]

[package.metadata.docs.rs]
all-features = true

# ---------------------------------------------------------------------------
# Linux パッケージング (issue #49)。release workflow (.github/workflows/release.yml)
# が tag push 時に cargo-deb / cargo-generate-rpm を呼んで .deb / .rpm を生成し、
# GitHub Release に添付する。
# ---------------------------------------------------------------------------

# cargo-deb: https://github.com/kornelski/cargo-deb
# `cargo deb --no-build --target <triple>` で pre-built バイナリから .deb を作る。
[package.metadata.deb]
maintainer = "astail <kiyomillefeuille@gmail.com>"
copyright = "2026, astail <kiyomillefeuille@gmail.com>"
license-file = ["LICENSE", "0"]
extended-description = """\
vozltop is an htop-like real-time TUI for nginx-module-vts. \
It fetches the nginx /status/format/json endpoint at a configurable interval \
and visualizes server / upstream / cache zones with sortable tables, \
filters, and p95 latency from request histograms."""
section = "utils"
priority = "optional"
assets = [
    ["target/release/vozltop", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/vozltop/README.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/vozltop/CHANGELOG.md", "644"],
]

# cargo-generate-rpm: https://github.com/cat-in-136/cargo-generate-rpm
# `cargo generate-rpm --target <triple>` で .rpm を作る。
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/vozltop", dest = "/usr/bin/vozltop", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/vozltop/README.md", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/vozltop/CHANGELOG.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/doc/vozltop/LICENSE", mode = "644", doc = true },
]

[dependencies]
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false }
# issue #25: ratatui 既定の crossterm backend を再有効化。これにより transitive
# に crossterm 0.28 が同居するが (event loop 側は 0.29 を直接使用)、deny.toml の
# `multiple-versions = "warn"` 設定で CI は通る (PR #84)。ratatui 0.30 +
# ratatui-crossterm への移行で 0.29 に統一する案は別途 issue #14 で検討する。
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "signal", "net", "io-util"] }
# issue #46: TOML config + alias 起動 (`vozltop @prod`)。
# - `toml`: deserialize-only。serialize は不要 (config を vozltop が書き出すことはない)。
# - `directories`: XDG ベースの config path 解決 (Linux/macOS/Windows 対応)。
# keyring 連携は Phase 2 別 issue で検討。本 PR では password 平文許容
# (chmod 0600 推奨を docstring に記載)。
toml = { version = "0.8", default-features = false, features = ["parse"] }
directories = "5"
url = "2"

[dev-dependencies]
pretty_assertions = "1"
# issue #35: UI レンダリングの snapshot テスト。TestBackend の Display 出力を
# 文字列 snapshot に焼き付けるため、yaml feature は使わない (serde_yaml は
# unmaintained で cargo-deny advisory を踏むリスクがあり、TUI 描画は
# プレーン文字列 snapshot の方が diff が読みやすい)。
insta = "1"
# issue #36: integration test 用の HTTP mock サーバ。tokio runtime で動く。
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
