[package]
name = "vozltop"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "htop-like real-time TUI for nginx-module-vts"
repository = "https://github.com/astail/vozltop"
license = "MIT"
readme = "README.md"
keywords = ["nginx", "vts", "tui", "monitoring"]
categories = ["command-line-utilities"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "signal", "net", "io-util"] }
url = "2"

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
