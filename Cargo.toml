[package]
name = "vozltop"
version = "0.1.0"
edition = "2021"
description = "htop-like real-time TUI for nginx-module-vts"
repository = "https://github.com/astail/vozltop"
license = "MIT"
readme = "README.md"
keywords = ["nginx", "vts", "tui", "monitoring"]
categories = ["command-line-utilities"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false }
# crossterm backend は main の crossterm 0.29 と二重持ちになるため一旦無効化。
# UI loop 実装時 (issue #25) に ratatui 0.30 or feature 再有効化を判断する。
ratatui = { version = "0.29", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "signal", "net", "io-util"] }
url = "2"

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
