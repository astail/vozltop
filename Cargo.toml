[package]
name = "vozltop"
version = "0.1.0"
edition = "2021"
description = "htop-like real-time TUI for nginx-module-vts"
repository = "https://github.com/astail/vozltop"
license = "MIT"
readme = "README.md"
keywords = ["nginx", "vts", "tui", "monitoring"]
categories = ["command-line-utilities"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false }
# issue #25: ratatui 既定の crossterm backend を再有効化。これにより transitive
# に crossterm 0.28 が同居するが (event loop 側は 0.29 を直接使用)、deny.toml の
# `multiple-versions = "warn"` 設定で CI は通る (PR #84)。ratatui 0.30 +
# ratatui-crossterm への移行で 0.29 に統一する案は別途 issue #14 で検討する。
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "signal", "net", "io-util"] }
url = "2"

[dev-dependencies]
pretty_assertions = "1"
# issue #35: UI レンダリングの snapshot テスト。TestBackend の Display 出力を
# 文字列 snapshot に焼き付けるため、yaml feature は使わない (serde_yaml は
# unmaintained で cargo-deny advisory を踏むリスクがあり、TUI 描画は
# プレーン文字列 snapshot の方が diff が読みやすい)。
insta = "1"
# issue #36: integration test 用の HTTP mock サーバ。tokio runtime で動く。
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
